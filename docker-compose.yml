services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fireline
      POSTGRES_PASSWORD: fireline
      POSTGRES_DB: fireline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
